<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Unison challenge</title><style>
:root{--bg:#f7f6fb;--fg:#15142a;--muted:#5b5a73;--accent:#b8620a;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#06071a;--fg:#f2f1ff;--muted:#a9a8c4;--accent:#ffb547;--card:#100c2e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:40px 16px 64px;text-align:center}h1{font-size:1.9rem;line-height:1.2;margin:.2em 0}
.muted{color:var(--muted)}.score{font-size:3rem;font-weight:800;color:var(--accent);margin:.2em 0}
.card{background:var(--card);border-radius:20px;padding:24px 20px;margin:20px 0}
.btn{display:block;padding:14px 18px;border-radius:14px;font-weight:700;text-decoration:none;margin:12px 0}
.primary{background:var(--accent);color:#15142a}.secondary{border:2px solid var(--accent);color:var(--accent)}
</style></head>
<body><main>
<div class="card">
<p class="muted" id="who">A friend challenged you</p>
<h1 id="what">Sing in tune with Unison</h1>
<p class="score" id="score"></p>
<p class="muted" id="how">Sing the same thing in the Unison app and see who wins.</p>
<a class="btn primary" id="open" href="unison://challenge">Take the challenge in Unison</a>
<a class="btn secondary" href="https://apps.apple.com/app/id6817522941">Get Unison on the App Store</a>
</div>
<p class="muted">Don't have the app yet? Install it, then come back and tap this link again.</p>
<p class="muted"><a href="../">Unison support</a> &middot; <a href="../privacy/">Privacy</a></p>
</main>
<script>
// The challenge rides in the part after "#", which browsers never send to the server.
const SONGS = {"hot-cross-buns": "Hot Cross Buns", "twinkle": "Twinkle, Twinkle, Little Star", "mary": "Mary Had a Little Lamb", "ode-to-joy": "Ode to Joy", "jingle-bells": "Jingle Bells", "london-bridge": "London Bridge", "au-clair-de-la-lune": "Au Clair de la Lune", "frere-jacques": "Are You Sleeping (Frère Jacques)", "row-your-boat": "Row, Row, Row Your Boat", "happy-birthday": "Happy Birthday", "amazing-grace": "Amazing Grace", "auld-lang-syne": "Auld Lang Syne", "joy-to-the-world": "Joy to the World", "o-come-all-ye-faithful": "O Come, All Ye Faithful", "away-in-a-manger": "Away in a Manger", "deck-the-halls": "Deck the Halls", "we-wish-you-a-merry-christmas": "We Wish You a Merry Christmas", "brahms-lullaby": "Brahms' Lullaby", "this-old-man": "This Old Man", "old-macdonald": "Old MacDonald Had a Farm", "jesus-loves-me": "Jesus Loves Me", "when-the-saints": "When the Saints Go Marching In", "my-bonnie": "My Bonnie Lies Over the Ocean", "michael-row": "Michael, Row the Boat Ashore", "clementine": "Oh My Darling, Clementine", "doxology": "Praise God, from Whom All Blessings Flow", "holy-holy-holy": "Holy, Holy, Holy", "bridal-chorus": "Here Comes the Bride", "jolly-good-fellow": "For He's a Jolly Good Fellow", "yankee-doodle": "Yankee Doodle"};
const q = new URLSearchParams(location.hash.slice(1));
const kind = q.get("k"), p = parseFloat(q.get("p"));
const name = (q.get("n") || "A friend").replace(/[^\p{L}\p{N} .'-]/gu, "").slice(0, 20) || "A friend";
let what = null, score = null;
if (kind === "song" && SONGS[q.get("s")] && p >= 0 && p <= 1) { what = SONGS[q.get("s")]; score = Math.round(p * 100) + "% in tune"; }
if (kind === "breath" && p >= 0 && p <= 120) { what = "Hold an even breath"; score = p.toFixed(1) + " s"; }
if (kind === "longTone" && p >= 0 && p <= 120) { what = "Hold a steady note"; score = p.toFixed(1) + " s"; }
if (what) {
  document.getElementById("who").textContent = name + " challenged you";
  document.getElementById("what").textContent = what;
  document.getElementById("score").textContent = "Beat " + score;
  document.getElementById("open").href = "unison://challenge?" + location.hash.slice(1);
}
</script>
</body></html>
